[project]
name = "cortex-deployer"
version = "0.3.2"
description = "Local model control plane: llama.cpp / SGLang / vLLM / MLX, Web UI, Cortex connect"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Shizuha Labs" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6.0",
]
scripts = { cortex-deployer = "cortex_deployer.cli:main" }

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex_deployer*"]

[tool.setuptools.package-data]
cortex_deployer = ["recipes/examples/*.yaml", "web/*", "data/*.json"]
