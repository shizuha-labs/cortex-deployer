schema_version: deployer.recipe.v1
name: qwen38-27b-llamacpp
engine: llamacpp
executor: process
quant: UD-Q4_K_XL
min_vram_mb: 22000
notes: UD-Q4_K_XL is ~17.9 GB plus KV — needs a 24 GB class card. A 16 GB 5080 should use the Q3 recipe.
download_glob: "*UD-Q4_K_XL.gguf"
model:
  id: Qwen3.8-27B-Q4
  served_name: Qwen3.8-27B-Q4
  source:
    kind: huggingface
    repo: unsloth/Qwen3.8-27B-GGUF
    filename: Qwen3.8-27B-UD-Q4_K_XL.gguf
    path: ""
launch:
  host: 127.0.0.1
  port: 8080
  context_length: 8192
  extra_args:
    - --n-gpu-layers
    - "99"
connect:
  aliases:
    - Qwen3.8-27B-Q4
  max_concurrent: 1
