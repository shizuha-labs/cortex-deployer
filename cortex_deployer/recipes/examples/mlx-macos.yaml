schema_version: deployer.recipe.v1
name: mlx-macos
engine: mlx
executor: process
quant: "8bit"
min_vram_mb: 0
notes: Apple Silicon / Metal. Point path at a local MLX folder (mlx-community 8-bit).
model:
  id: local-mlx
  served_name: local-mlx
  source:
    kind: local_path
    path: /path/to/mlx-model
launch:
  host: 127.0.0.1
  port: 8014
  extra_args: []
connect:
  aliases: []
  max_concurrent: 2
