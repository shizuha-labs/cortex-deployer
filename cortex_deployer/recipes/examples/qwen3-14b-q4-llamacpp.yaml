schema_version: deployer.recipe.v1
name: qwen3-14b-q4-llamacpp
engine: llamacpp
executor: process
quant: UD-Q4_K_XL
min_vram_mb: 13500
notes: 16 GB 14B agentic pick. 64k ctx.
download_glob: "*UD-Q4_K_XL.gguf"
model:
  id: Qwen3-14B-Q4
  served_name: Qwen3-14B-Q4
  source:
    kind: huggingface
    repo: unsloth/Qwen3-14B-GGUF
    filename: Qwen3-14B-UD-Q4_K_XL.gguf
    path: ""
launch:
  host: 127.0.0.1
  port: 8080
  context_length: 65536
  extra_args:
